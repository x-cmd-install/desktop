g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":104125168,"digest":"sha256:8591434fcf498a836a32bc7314eb89fbdc4bdc8f03a2d735774b1ae69b6b21d5","download_count":288,"created_at":"2026-11-12T10:18:29Z","updated_at":"2026-11-12T10:18:35Z"},{"id":739015270,"node_id":"RA_kwDOLmfWBM4sDHpm","name":"zen.linux-x86_64.tar.xz","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/x-xz","state":"uploaded","size":114783400,"digest":"sha256:bcf7e43160ecfe5f29953ed2a984e7a8028a58f2ec0e3114d36bb904d5f5ce80","download_count":10600,"created_at":"2026-11-12T10:18:29Z","updated_at":"2026-11-12T10:18:35Z"},{"id":739015265,"node_id":"RA_kwDOLmfWBM4sDHph","name":"zen.macos-universal.dmg","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":240772424,"digest":"sha256:04ee33c2e906b52f90f73384aa50e80a92530ae4b3414fb26a0a982e257f172c","download_count":16526,"created_at":"2026-11-12T10:18:29Z","updated_at":"2026-11-12T10:18:39Z"},{"id":739015275,"node_id":"RA_kwDOLmfWBM4sDHpr","name":"zen.source.tar.zst","label":"","uploader":{"login":"mr-cheffy","id":91018726,"node_id":"U_kgDOBWzV5g","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":1088036136,"digest":"sha256:61435d4fd7df83f216d0d18cbc6686d43ecbaf8b79cf159c10604c229d628dff","download_count":190,"created_at":"2026-11-12T10:18:29Z","updated_at":"2026-11-12T10:19:07Z"}],"body":"# Zen Stable Release\r\n\r\n\r\n## Security\r\n- https://www.mozilla.org/en-US/security/advisories/mfsa2026-125/\r\n\r\n## New Features\r\n- Updated to Firefox 160.0\r\n- Added pause context menu button for the downloads section\r\n- The urlbar now has a bit of transparency for a more modern look.\r\n- The Picture-in-Picture player now has a playback speed setting, with options ranging from 0.25x to 2.0x speed. The setting appears only when the player window is medium-sized or larger.\r\n- Pages saved as PDF now make mathematical content (MathML) accessible to assistive technology such as screen readers.\r\n- Websites that repeatedly ask to handle email (mailto:) and other links can now be blocked with a new “Never allow” button, and blocked sites can be managed in Settings.\r\n- Zen now plays Matroska (MKV) files with FLAC, MP3, or PCM audio.\r\n- WebGL content on macOS is now rendered using Apple's Metal graphics API, which can improve performance on some sites.\r\n\r\n## Fixes\r\n- Improved performance for boosts color tinting.\r\n- Fixed the first character typed into the address bar or search bar sometimes being lost when typing quickly right after clicking into it.\r\n- Fixed Zen freezing for several seconds when signing in to intranet sites that use NTLM or Kerberos (Negotiate) authentication.\r\n- Fixed double-tapping or long-pressing a word to select it, and tapping to place the cursor, not working near the cursor in text fields.\r\n- Fixed links opened in the background from other apps on macOS, such as RSS readers, bringing Zen to the foreground.\r\n- Fixed downloaded files on macOS sometimes opening in the wrong application instead of the default one set in Finder.\r\n- Fixed simultaneous downloads on macOS never finishing when Zen is set to ask where to save files. Only the first file showed a save dialog.\r\n- Restored meaningful filenames and the usual save workflow for PDFs opened in Preview from the macOS print dialog.\r\n- More bug fixes and improvements.\r\n\r\n## Changes\r\n- The address bar context menu now shows \"Paste and Search\" instead of \"Paste and Go\" when the copied text is a search term rather than a web address.\r\n","reactions":{"total_count":27,"+1":11,"-1":0,"laugh":0,"hooray":4,"confused":0,"heart":9,"rocket":1,"eyes":2}}
